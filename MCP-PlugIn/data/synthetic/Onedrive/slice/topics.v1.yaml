# Keywords the page finder uses. Matching is case-insensitive. It is deliberately generous:
# a missed clause is worse than an extra page. Add synonyms here when the eval shows a miss.
version: 1
topics:
  rebates:
    description: Rebates and volume incentives
    keywords: [rebate, rebates, incentive, volume tier, volume discount, price protection]
  fees:
    description: Administrative and service fees
    keywords: [admin fee, administrative fee, distribution fee, service fee, data fee, fee schedule, fees]
  effective_date:
    description: When terms start or change
    keywords: [effective date, effective as of, effective on, back-dated, backdated, retroactive, amendment no, supersede]
  payment_terms:
    description: Payment terms and prompt-pay discounts
    keywords: [payment terms, net 30, net 45, net 60, prompt pay, prompt-pay]
  returns:
    description: Returns
    keywords: [returns, return policy, returned goods]
  chargebacks:
    description: Chargebacks and contract pricing to wholesalers
    keywords: [chargeback, charge-back, contract price, wholesaler price]
selection:
  always_include_first_page: true   # parties, date and term are usually on page 1
  include_neighbour_pages: true     # a clause often continues on the next page
