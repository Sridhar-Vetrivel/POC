<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1280" viewBox="0 0 1600 1280">
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/></marker></defs>
<rect width="1600" height="1280" fill="#ffffff"/>
<text x="800.0" y="48" font-size="28" font-weight="700" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">Ingenus contract-check server: audit log, login log and shared check memory</text>
<text x="800.0" y="78" font-size="16" font-weight="400" fill="#64748b" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">Built and tried on a local Postgres 18 with synthetic data (Oct 2026). Not on the VM or at Ingenus yet.</text>
<rect x="30" y="100" width="1540" height="500" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="60" y="138" font-size="22" font-weight="700" fill="#1f2937" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">1. Audit log and login log, with history</text>
<rect x="60" y="175" width="280" height="90" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
<text x="200.0" y="213.0" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">Claude Desktop</text>
<text x="200.0" y="237.0" font-size="17" font-weight="400" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">the person signs in (Entra)</text>
<rect x="430" y="175" width="300" height="90" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="580.0" y="213.0" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">MCP server</text>
<text x="580.0" y="237.0" font-size="17" font-weight="400" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">every tool call and every login</text>
<rect x="820" y="160" width="340" height="120" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="990.0" y="201.0" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">One event per call or login</text>
<text x="990.0" y="225.0" font-size="17" font-weight="400" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">who, when, tool, outcome</text>
<text x="990.0" y="249.0" font-size="17" font-weight="400" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">never page text, never tokens</text>
<line x1="340" y1="220" x2="430" y2="220" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<text x="385.0" y="212.0" font-size="15" font-weight="400" fill="#334155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">token</text>
<line x1="730" y1="220" x2="820" y2="220" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<text x="775.0" y="212.0" font-size="15" font-weight="400" fill="#334155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">writes</text>
<rect x="430" y="360" width="360" height="120" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
<text x="610.0" y="389.0" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">Local log file (JSONL)</text>
<text x="610.0" y="413.0" font-size="17" font-weight="400" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">written FIRST, never lost</text>
<text x="610.0" y="437.0" font-size="17" font-weight="400" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">each line holds the hash of</text>
<text x="610.0" y="461.0" font-size="17" font-weight="400" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">the line before it (hash chain)</text>
<rect x="900" y="360" width="330" height="120" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="1065.0" y="401.0" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">Postgres: table events</text>
<text x="1065.0" y="425.0" font-size="17" font-weight="400" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">searchable history</text>
<text x="1065.0" y="449.0" font-size="17" font-weight="400" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">who did what, when</text>
<line x1="990" y1="280" x2="650" y2="360" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="790" y1="420" x2="900" y2="420" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<text x="845.0" y="410.0" font-size="15" font-weight="400" fill="#334155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">copied</text>
<text x="845" y="510" font-size="15" font-weight="400" fill="#64748b" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">If Postgres is down, nothing is lost: `audit ship` copies the missing events later.</text>
<rect x="1290" y="175" width="250" height="305" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
<text x="1415.0" y="200.5" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">Commands</text>
<text x="1415.0" y="224.5" font-size="15" font-weight="400" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"></text>
<text x="1415.0" y="248.5" font-size="15" font-weight="400" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">audit verify</text>
<text x="1415.0" y="272.5" font-size="15" font-weight="400" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">finds an edited, removed</text>
<text x="1415.0" y="296.5" font-size="15" font-weight="400" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">or reordered line</text>
<text x="1415.0" y="320.5" font-size="15" font-weight="400" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"></text>
<text x="1415.0" y="344.5" font-size="15" font-weight="400" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">audit query</text>
<text x="1415.0" y="368.5" font-size="15" font-weight="400" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">by user, tool, event</text>
<text x="1415.0" y="392.5" font-size="15" font-weight="400" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"></text>
<text x="1415.0" y="416.5" font-size="15" font-weight="400" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">audit prune</text>
<text x="1415.0" y="440.5" font-size="15" font-weight="400" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">deletes rows older</text>
<text x="1415.0" y="464.5" font-size="15" font-weight="400" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">than N days</text>
<line x1="1230" y1="420" x2="1290" y2="420" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<text x="60" y="560" font-size="15" font-weight="400" fill="#64748b" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Limit: a cut at the very END of the log cannot be seen. Keep a copy of the last hash elsewhere. One server process per log file.</text>
<rect x="30" y="620" width="1540" height="640" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="60" y="658" font-size="22" font-weight="700" fill="#1f2937" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">2. Shared memory of checks: so the next person does not start from zero</text>
<rect x="60" y="740" width="330" height="110" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="225.0" y="776.0" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">Day 1: you run a check</text>
<text x="225.0" y="800.0" font-size="17" font-weight="400" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">compare_contract_to_sap</text>
<text x="225.0" y="824.0" font-size="17" font-weight="400" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">(after the figures are done)</text>
<rect x="540" y="690" width="340" height="100" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="710.0" y="721.0" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">checks</text>
<text x="710.0" y="745.0" font-size="17" font-weight="400" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">one row per check: who, when,</text>
<text x="710.0" y="769.0" font-size="17" font-weight="400" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">customer, as-of date, totals</text>
<rect x="540" y="810" width="340" height="100" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="710.0" y="841.0" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">check_docs</text>
<text x="710.0" y="865.0" font-size="17" font-weight="400" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">the files each check used,</text>
<text x="710.0" y="889.0" font-size="17" font-weight="400" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">with the file version</text>
<rect x="540" y="930" width="340" height="120" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="710.0" y="959.0" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">term</text>
<text x="710.0" y="983.0" font-size="17" font-weight="400" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">each verified rate with its exact</text>
<text x="710.0" y="1007.0" font-size="17" font-weight="400" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">quote, page, file fingerprint,</text>
<text x="710.0" y="1031.0" font-size="17" font-weight="400" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">who verified it, last used</text>
<line x1="390" y1="785" x2="540" y2="745" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="390" y1="795" x2="540" y2="860" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="390" y1="815" x2="540" y2="980" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="1030" y="740" width="330" height="100" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
<text x="1195.0" y="771.0" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">get_check_history</text>
<text x="1195.0" y="795.0" font-size="17" font-weight="400" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">what did earlier checks find,</text>
<text x="1195.0" y="819.0" font-size="17" font-weight="400" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">and has any file changed since?</text>
<rect x="1030" y="930" width="330" height="100" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
<text x="1195.0" y="961.0" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">get_contract_terms</text>
<text x="1195.0" y="985.0" font-size="17" font-weight="400" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">terms already known, so Claude</text>
<text x="1195.0" y="1009.0" font-size="17" font-weight="400" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">reads only new or changed files</text>
<line x1="880" y1="760" x2="1030" y2="780" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<text x="955.0" y="762.0" font-size="15" font-weight="400" fill="#334155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">reads</text>
<line x1="880" y1="860" x2="1030" y2="800" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="880" y1="990" x2="1030" y2="980" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<text x="955.0" y="977.0" font-size="15" font-weight="400" fill="#334155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">reads</text>
<rect x="1410" y="820" width="140" height="130" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
<text x="1480.0" y="854.0" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">Day 3:</text>
<text x="1480.0" y="878.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">Aditya or</text>
<text x="1480.0" y="902.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">a third</text>
<text x="1480.0" y="926.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">person</text>
<line x1="1360" y1="790" x2="1410" y2="860" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="1360" y1="980" x2="1410" y2="920" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<text x="60" y="1090" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Rules</text>
<text x="60" y="1120" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">• A record is shown only if the asker can open every file it used (tested with their own access).</text>
<text x="60" y="1146" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">• The file stays the truth: if a file changes, its stored terms are set aside and the file is read again.</text>
<text x="60" y="1172" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">• Stored terms are verified by code against the page, not reviewed by a person. Kept 90 days from last use.</text>
<text x="60" y="1198" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">• Chats are not shared: the server keeps only what passed through its tools.</text>
<text x="60" y="1240" font-size="15" font-weight="400" fill="#64748b" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Status: built and live-tested on a laptop with synthetic data. Open: VM (Aditya), Ingenus acceptance of stored quotes, Part 11 applicability, a server check for incomplete stored terms.</text>
</svg>