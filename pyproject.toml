[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ingenus-poc"
version = "0.1.0"
description = "Ingenus POC: read-only AI layer over SAP and document folders (Phase 1: MCP plug-in)"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",      # official MCP Python SDK; v2 API (MCPServer). Checked 13 Oct 2026
    "pydantic>=2.7",
    "pyyaml>=6",
    "pypdf>=4",
    "msal>=1.31",           # Microsoft sign-in library: swaps the user's token for a Graph token (V1-6)
    "requests>=2.32",       # Microsoft Graph calls (sync, like the tools)
    "pyjwt[crypto]>=2.8",   # checks the Entra sign-in token (V1-4)
    "psycopg[binary]>=3.2",  # talks to Postgres, the audit store and check history (decision 0008)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "reportlab>=4",     # only to generate the synthetic contract PDFs
    "bandit>=1.7",      # security scan (scripts/check.py)
    "pip-audit>=2.7",   # known-vulnerability scan (scripts/check.py; needs network)
]

# Phase 1 v0 lives under MCP-PlugIn/src, v1 under MCP-Server/src; the SAP interface and mock adapter are shared at the repo root.
[tool.setuptools]
package-dir = { "ingenus_plugin" = "MCP-PlugIn/src/ingenus_plugin", "ingenus_mcp" = "MCP-Server/src/ingenus_mcp", "mcp_servers" = "mcp_servers" }
packages = [
    "ingenus_plugin",
    "ingenus_plugin.core",
    "ingenus_plugin.server",
    "ingenus_mcp",
    "ingenus_mcp.core",
    "ingenus_mcp.tools",
    "ingenus_mcp.server",
    "mcp_servers",
    "mcp_servers.sap",
    "mcp_servers.sap.adapters",
]

[tool.pytest.ini_options]
testpaths = ["tests", "MCP-PlugIn/tests", "MCP-Server/tests"]
markers = ["live: tests that call the Claude API (cost money; run only when asked)"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".spike", "build", "MCP-PlugIn/build"]   # build/ holds the generated desktop-extension bundle

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]   # long tool descriptions and quotes are intentional; the formatter wraps code

[tool.ruff.lint.per-file-ignores]
# v1 tests import their pytest fixtures from v1_support (no second conftest.py, see v1_support.py);
# a test that takes a fixture as a parameter then "redefines" the imported name. That is how pytest works.
"MCP-Server/tests/*" = ["F811"]

[tool.ruff.lint.isort]
known-first-party = ["ingenus_plugin", "ingenus_mcp", "mcp_servers"]
