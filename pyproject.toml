[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ingenus-poc"
version = "0.1.0"
description = "Ingenus POC: read-only AI layer over SAP and document folders (Phase 1: MCP plug-in)"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",      # official MCP Python SDK; v2 API (MCPServer). Checked 13 Oct 2026
    "pydantic>=2.7",
    "pyyaml>=6",
    "pypdf>=4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "reportlab>=4",     # only to generate the synthetic contract PDFs
    "bandit>=1.7",      # security scan (scripts/check.py)
    "pip-audit>=2.7",   # known-vulnerability scan (scripts/check.py; needs network)
]

# Phase 1 code lives under MCP-PlugIn/src; the SAP interface and mock adapter are shared at the repo root.
[tool.setuptools]
package-dir = { "ingenus_plugin" = "MCP-PlugIn/src/ingenus_plugin", "mcp_servers" = "mcp_servers" }
packages = [
    "ingenus_plugin",
    "ingenus_plugin.core",
    "ingenus_plugin.server",
    "mcp_servers",
    "mcp_servers.sap",
    "mcp_servers.sap.adapters",
]

[tool.pytest.ini_options]
testpaths = ["tests", "MCP-PlugIn/tests"]
markers = ["live: tests that call the Claude API (cost money; run only when asked)"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".spike", "build"]   # build/ holds the generated desktop-extension bundle

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]   # long tool descriptions and quotes are intentional; the formatter wraps code

[tool.ruff.lint.isort]
known-first-party = ["ingenus_plugin", "mcp_servers"]
