# Deterministic comparison rules. Plain code reads this file; there is no AI in the comparison.
version: 1
rate_tolerance_pct: 0          # any difference counts: 5.5 against 5.56 is a variance
rounding_places: 2
exposure:
  method: daily_in_partial_months   # a month that is only partly covered is counted by days
  label: indicative                 # never present the figure as an accounting number
default_basis:
  rebate: product_net_sales
  admin_fee: total_net_sales
